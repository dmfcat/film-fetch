[project]
name = "film-fetch"
version = "0.2.0"
description = "Simple CLI tool that returns a list of films containing specified cast/crew and genres"
readme = "README.md"
license = "MIT"
license-files = ["LICENCE"]
authors = [
    { name = "dmfcat", email = "david@dmfcat.net" }
]
requires-python = ">=3.15"
dependencies = [
    "python-dotenv>=1.2.4",
    "questionary>=2.1.1",
    "requests>=2.34.2",
    "rich>=15.0.0",
]

[project.scripts]
film-fetch = "film_fetch.main:run_app"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.5"]
build-backend = "uv_build"
