[project]
name = "film-fetch"
version = "0.1.0"
description = "Simple CLI TUI tool that returns a list of films containing specified cast/crew and genres"
readme = "README.md"
authors = [
    { name = "david", email = "david@dmfcat.net" }
]
requires-python = ">=3.14"
dependencies = [
    "python-dotenv>=1.2.4",
    "questionary>=2.1.1",
    "rich>=15.0.0",
    "tmdbsimple>=2.9.8",
]

[project.scripts]
film-fetch = "film_fetch:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
